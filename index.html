<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마감 D-1: 새내기의 아주 긴 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#FBFBF7;
  --paper-2:#EAF1EC;
  --ink:#24232B;
  --ink-soft:#5D5C68;
  --mint:#1E9C84;
  --mint-soft:#D3EFE7;
  --on-mint:#FFFFFF;
  --java:#5A3A2E;
  --grid:#D6EAE2;
  --grid-strong:#8CC5B3;
  --rule:#E2EBE7;
  --note:#FFF4B0;
  --note-2:#D6F2E8;
  --note-ink:#24232B;
  --veil:rgba(18,18,26,.58);
  --shadow:rgba(36,35,43,.16);
  --stage:#1B1B22;
  --phone-frame:#16171D;
  --phone-bg:#F6F6F9;
  --phone-line:#E2E2EA;
  --phone-ink:#1F1F26;
  --phone-soft:#6B6B78;
  --bubble:#FFFFFF;
  --bubble-me:#1E9C84;
  --bubble-me-ink:#FFFFFF;
  --tag:#FFE9A8;
  --tag-ink:#5A4500;
  --thought-bg:rgba(255,255,255,.88);
  --thought-ink:#4A3F57;
  --hand:'Nanum Pen Script','Gowun Dodum',cursive;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#1D1C23; --paper-2:#141318; --ink:#ECEAF3; --ink-soft:#A9A7B6;
    --mint:#3CCBAE; --mint-soft:#1E3A34; --on-mint:#0E211C; --java:#D9B3A3;
    --grid:#26332F; --grid-strong:#3F6B60; --rule:#2B2A33;
    --note:#EADF92; --note-2:#A9DCCB; --veil:rgba(6,6,10,.66); --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#1D1C23; --paper-2:#141318; --ink:#ECEAF3; --ink-soft:#A9A7B6;
  --mint:#3CCBAE; --mint-soft:#1E3A34; --on-mint:#0E211C; --java:#D9B3A3;
  --grid:#26332F; --grid-strong:#3F6B60; --rule:#2B2A33;
  --note:#EADF92; --note-2:#A9DCCB; --veil:rgba(6,6,10,.66); --shadow:rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font:inherit}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 원고지 바탕 */
.sheet-bg{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;background-position:-1px -1px}

/* 시작 화면 */
#title{overflow-y:auto;display:flex;flex-direction:column;padding:32px 20px}
.title-wrap{width:min(580px,100%);margin:auto;text-align:center;position:relative}
.ring{position:absolute;right:-4%;top:-18%;width:132px;height:132px;border-radius:50%;border:8px solid var(--java);opacity:.1;pointer-events:none}
.manuscript{display:inline-grid;grid-auto-flow:column;border-top:2px solid var(--grid-strong);border-left:2px solid var(--grid-strong);background:var(--paper)}
.manuscript span{width:clamp(44px,min(14vw,15vh),92px);height:clamp(44px,min(14vw,15vh),92px);display:grid;place-items:center;border-right:2px solid var(--grid-strong);border-bottom:2px solid var(--grid-strong);font-family:var(--hand);font-size:clamp(38px,min(12vw,13vh),82px);line-height:1;color:var(--ink)}
.manuscript b{font-weight:400;display:inline-block;opacity:0;transform:translateY(5px) rotate(-4deg);animation:write .45s ease forwards}
@keyframes write{to{opacity:1;transform:none}}
.sub{font-family:var(--hand);font-size:clamp(30px,6.5vw,40px);margin:18px 0 10px;color:var(--ink)}
.premise{margin:0 auto 30px;max-width:30em;font-size:16px;line-height:1.75;color:var(--ink-soft);word-break:keep-all}
.namebox{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end}
.namebox label{width:100%;font-size:15px;color:var(--ink-soft)}
.namebox input{font:inherit;font-size:22px;padding:8px 6px;width:min(220px,60vw);text-align:center;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
.namebox input:focus{outline:none;border-bottom-color:var(--mint)}
.btn{font-family:var(--body);font-size:18px;padding:12px 24px;border:0;border-radius:12px;background:var(--mint);color:var(--on-mint);cursor:pointer;box-shadow:0 4px 0 var(--java)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--java)}
.btn:focus-visible,.namebox input:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.hint{margin-top:28px;font-size:14px;color:var(--ink-soft);line-height:1.7;word-break:keep-all}

/* 게임 무대 */
#game{background:var(--stage);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
.scene{position:absolute;inset:0;transition:filter .7s ease}
.scene-layer{position:absolute;inset:0;transition:opacity .6s ease}
.scene-layer svg{display:block;width:100%;height:100%}
.drift{animation:drift 24s linear infinite}
@keyframes drift{to{transform:translateX(var(--w))}}
.veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease;background:radial-gradient(ellipse at 50% 45%,rgba(255,252,244,0) 40%,rgba(255,252,244,.9) 100%)}
.thought{position:absolute;z-index:4;top:84px;left:50%;transform:translateX(-50%);font-family:var(--hand);font-size:30px;line-height:1.1;color:var(--thought-ink);background:var(--thought-bg);border:2px dashed #B9AFC8;border-radius:999px;padding:4px 24px 6px;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
#game.imagine .scene{filter:sepia(.5) saturate(.75) blur(2px) brightness(1.06)}
#game.imagine .veil,#game.imagine .thought{opacity:1}
#game.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.chars{position:absolute;inset:0;pointer-events:none;z-index:3}
.char{position:absolute;bottom:40px;height:min(64%,540px);aspect-ratio:3/4;transform:translateX(-50%);transition:opacity .35s ease,transform .35s ease,filter .25s ease,left .35s ease}
.char svg{display:block;width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2))}
.char.pos-center{left:50%}
.char.pos-left{left:29%}
.char.pos-right{left:71%}
.char.entering{opacity:0;transform:translate(-50%,16px)}
.char.leaving{opacity:0}
.char.dim{filter:brightness(.7) saturate(.85)}

.hud{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.stamp{background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 14px 8px;box-shadow:0 3px 0 var(--shadow);transform:rotate(-1.5deg);max-width:62%}
.stamp .when{font-family:var(--hand);font-size:30px;line-height:1}
.stamp .day{color:var(--mint);margin-right:8px}
.stamp .where{font-size:13px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cells{display:flex;background:var(--paper);border-top:1.5px solid var(--grid-strong);border-left:1.5px solid var(--grid-strong)}
.cells i{display:block;width:16px;height:16px;border-right:1.5px solid var(--grid-strong);border-bottom:1.5px solid var(--grid-strong);transition:background .4s}
.cells i.done{background:var(--mint)}

.dialog{position:absolute;z-index:6;left:50%;bottom:14px;transform:translateX(-50%);width:min(900px,calc(100% - 20px));min-height:142px;padding:24px 26px 30px;border-radius:14px;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 15px;color:var(--ink);box-shadow:0 12px 34px rgba(0,0,0,.3)}
.line{margin:0;font-size:19px;line-height:32px;min-height:64px;word-break:keep-all;overflow-wrap:anywhere}
.dialog.narr .line{color:var(--ink-soft)}
.nameplate{position:absolute;top:-18px;left:22px;font-family:var(--hand);font-size:27px;line-height:1;padding:5px 16px 7px;border-radius:8px;background:var(--mint);color:var(--on-mint);transform:rotate(-2deg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.nameplate.me{background:var(--java);color:var(--paper)}
.more{position:absolute;right:20px;bottom:12px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--mint);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.phone{position:absolute;z-index:5;left:50%;top:76px;transform:translateX(-50%);width:min(330px,84vw);max-height:calc(100% - 270px);background:var(--phone-frame);border-radius:34px;padding:11px;box-shadow:0 22px 50px rgba(0,0,0,.45);display:flex}
.ph-screen{background:var(--phone-bg);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;width:100%;min-height:0}
.ph-head{padding:12px 16px;font-weight:700;font-size:15px;color:var(--phone-ink);border-bottom:1px solid var(--phone-line);flex:none}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1;min-height:0}
.ph-body.chat{justify-content:flex-end}
.bub{max-width:84%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;flex:none}
.bub.them{background:var(--bubble);border:1px solid var(--phone-line);align-self:flex-start;border-top-left-radius:4px;color:var(--phone-ink)}
.bub.me{background:var(--bubble-me);color:var(--bubble-me-ink);align-self:flex-end;border-top-right-radius:4px}
.bub .from{display:block;font-size:12px;color:var(--phone-soft);margin-bottom:2px}
.news{background:var(--bubble);border:1px solid var(--phone-line);border-radius:14px;padding:12px 13px;flex:none}
.news .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--tag);color:var(--tag-ink)}
.news h4{margin:7px 0 4px;font-size:15px;line-height:1.4;color:var(--phone-ink);word-break:keep-all}
.news p{margin:0;font-size:13px;line-height:1.55;color:var(--phone-soft);word-break:keep-all}

.choice{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:20px;padding:24px 16px;background:var(--veil);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:default}
.choice .prompt{margin:auto 0 0;flex:none;font-family:var(--hand);font-size:clamp(32px,5.5vw,46px);line-height:1.15;color:#FFFFFF;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.4);word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:16px;width:min(640px,100%);margin-bottom:auto;flex:none}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:0;border-radius:3px;padding:18px 20px 20px;background:var(--note);color:var(--note-ink);font-family:var(--body);font-size:18px;line-height:1.6;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);transform:rotate(-.8deg);transition:transform .15s ease;word-break:keep-all}
.opt:nth-child(2){background:var(--note-2);transform:rotate(.7deg)}
.opt:hover{transform:rotate(0) translateY(-2px)}
.opt:focus-visible{outline:3px solid #FFFFFF;outline-offset:4px}
.opt .key{font-family:var(--hand);font-size:30px;line-height:1;color:#5A3A2E;flex:none;margin-top:-2px}

.analyzing{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--paper);cursor:default}
.analyzing p{font-family:var(--hand);font-size:36px;margin:0;color:var(--ink)}
.analyzing .cells i{width:24px;height:24px;animation:fillc .25s ease forwards}
@keyframes fillc{to{background:var(--mint)}}

@media (max-width:600px){
  .line{font-size:17px;line-height:29px;min-height:58px}
  .dialog{padding:22px 18px 26px;min-height:130px;background-image:repeating-linear-gradient(to bottom,transparent 0 28px,var(--rule) 28px 29px);background-position:0 15px}
  .char{height:min(52%,430px)}
  .char.pos-left{left:27%}
  .char.pos-right{left:73%}
  .stamp .when{font-size:26px}
  .cells i{width:12px;height:12px}
  .opt{font-size:16px;padding:15px 16px 17px}
  .thought{top:92px;font-size:26px}
}

/* 가로로 눕힌 휴대폰처럼 세로가 짧은 화면 */
@media (max-height:520px) and (orientation:landscape){
  .hud{top:8px;left:10px;right:10px}
  .stamp{padding:4px 12px 6px}
  .stamp .when{font-size:24px}
  .stamp .where{font-size:12px}
  .cells i{width:12px;height:12px}
  .char{height:80%;bottom:26px}
  .char.pos-left{left:26%}
  .char.pos-right{left:74%}
  .dialog{bottom:8px;width:min(760px,calc(100% - 24px));min-height:96px;padding:16px 20px 18px;background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);background-position:0 9px}
  .line{font-size:16px;line-height:26px;min-height:52px}
  .nameplate{font-size:22px;top:-15px;padding:4px 13px 6px}
  .phone{top:46px;left:auto;right:14px;transform:none;width:min(300px,42vw);max-height:calc(100% - 172px);border-radius:26px;padding:8px}
  .ph-screen{border-radius:19px}
  .thought{top:54px;font-size:24px}
  .choice{gap:12px;padding:14px 16px}
  .choice .prompt{font-size:30px}
  .opts{gap:10px;width:min(720px,100%)}
  .opt{font-size:15.5px;line-height:1.5;padding:11px 16px 13px}
  .opt .key{font-size:24px}
}

/* 결과 화면 */
#result{overflow-y:auto;background:var(--paper-2);padding:28px 14px 56px}
.report{width:min(780px,100%);margin:0 auto;background:var(--paper);border-radius:6px;box-shadow:0 14px 40px var(--shadow);padding:clamp(22px,5vw,52px)}
.report .who{font-family:var(--hand);font-size:30px;color:var(--ink-soft);margin:0}
.type-title{font-family:var(--hand);font-weight:400;word-break:keep-all;font-size:clamp(56px,12vw,92px);line-height:1;margin:6px 0 8px;color:var(--ink)}
.type-tag{margin:0;font-size:18px;font-weight:700;color:var(--mint)}
.ruler{margin:30px 0 10px}
.ruler .ends{display:flex;justify-content:space-between;font-size:15px;color:var(--ink-soft);margin-bottom:8px}
.ruler .ends b{font-family:var(--hand);font-weight:400;font-size:26px;color:var(--ink)}
.ruler .bar{position:relative;height:36px;border:2px solid var(--ink);border-radius:4px;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 10%);background-size:100% 38%;background-repeat:no-repeat}
.pin{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;font-size:14px;font-weight:700;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--mint);transition:left 1.3s cubic-bezier(.2,.8,.2,1)}
.score{margin:12px 0 0;font-size:15px;color:var(--ink-soft)}
.desc{font-size:17px;line-height:1.9;margin:26px 0 0;word-break:keep-all}
.aside{border-left:4px solid var(--mint);padding:2px 0 2px 16px;margin:24px 0 0}
.aside h3{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ink-soft)}
.aside .big{font-family:var(--hand);font-size:32px;line-height:1.1;margin:0 0 6px;color:var(--ink)}
.aside p{margin:0;line-height:1.75;word-break:keep-all}
.report h2{font-family:var(--hand);font-weight:400;font-size:38px;line-height:1.1;margin:46px 0 14px;color:var(--ink)}
.tchart{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.tchart>div{padding:16px 18px 6px}
.tchart>div+div{border-left:2px solid var(--ink)}
.tchart h3{margin:0 0 8px;font-family:var(--hand);font-weight:400;font-size:32px;line-height:1}
.tchart p{margin:0 0 10px;line-height:1.75;font-size:15.5px;word-break:keep-all}
.tchart .k{color:var(--ink-soft);font-size:14.5px}
.review{list-style:none;margin:0;padding:0}
.review li{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:16px 0;border-top:1.5px dashed var(--grid-strong)}
.r-time{font-family:var(--hand);font-size:26px;line-height:1.1;color:var(--ink-soft)}
.r-time small{display:block;font-size:20px}
.r-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.r-theme{font-weight:700}
.chip{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.D{background:var(--ink);color:var(--paper)}
.chip.C{background:var(--mint);color:var(--on-mint)}
.r-choice{margin:0 0 6px;padding:8px 12px;background:var(--mint-soft);border-radius:4px;line-height:1.6;word-break:keep-all}
.r-why{margin:0;line-height:1.75;color:var(--ink-soft);font-size:15px;word-break:keep-all}
.review details{margin-top:8px}
.review summary{cursor:pointer;font-size:14px;color:var(--ink-soft);width:max-content}
.review summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.review details[open] .r-choice{background:transparent;border:1.5px solid var(--grid-strong);margin-top:8px}
.note{margin:34px 0 0;font-size:14px;line-height:1.75;color:var(--ink-soft);word-break:keep-all}
.again{margin-top:26px;text-align:center}
@media (max-width:620px){
  .tchart{grid-template-columns:1fr}
  .tchart>div+div{border-left:0;border-top:2px solid var(--ink)}
  .review li{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .manuscript b{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen sheet-bg" aria-label="시작 화면">
    <div class="title-wrap">
      <div class="ring" aria-hidden="true"></div>
      <h1 class="sr">마감 D-1</h1>
      <div class="manuscript" aria-hidden="true"><span><b style="animation-delay:.1s">마</b></span><span><b style="animation-delay:.35s">감</b></span><span></span><span><b style="animation-delay:.6s">D</b></span><span><b style="animation-delay:.75s">-</b></span><span><b style="animation-delay:.9s">1</b></span></div>
      <p class="sub">새내기의 아주 긴 하루</p>
      <p class="premise">꿈에 그리던 대학에 입학한 지 일주일. 첫 과제 마감까지 남은 시간은 딱 하루. 오늘 하루, 여러 장면에서 당신이라면 어떻게 할지 골라 주세요.</p>
      <div class="namebox">
        <label for="nm">이야기 속에서 불릴 이름</label>
        <input id="nm" maxlength="8" placeholder="예: 하늘" autocomplete="off">
        <button class="btn" id="startBtn" type="button">하루 시작하기</button>
      </div>
      <p class="hint">화면을 누르거나 스페이스바를 누르면 이야기가 넘어가요.<br>선택지는 숫자 1, 2 키로도 고를 수 있어요.</p>
    </div>
  </section>

  <section id="game" class="screen" tabindex="-1" aria-label="게임 화면" hidden>
    <div class="scene"></div>
    <div class="veil"></div>
    <div class="thought" aria-hidden="true">상상 중…</div>
    <div class="chars"></div>
    <div class="hud">
      <div class="stamp"><div class="when"><span class="day"></span><span class="hm"></span></div><div class="where"></div></div>
      <div class="cells" id="progress" role="img" aria-label="진행 0/10"></div>
    </div>
    <div class="phone" hidden></div>
    <div class="dialog narr">

<script>
(() => {
'use strict';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);

/* ---------- 이름과 조사 ---------- */
let playerName = '새내기';
const hasBatchim = w => {
  const c = w.charCodeAt(w.length - 1);
  if (!(c >= 0xAC00 && c <= 0xD7A3)) return false;
  return (c - 0xAC00) % 28 !== 0;
};
const fill = s => s.replace(/\{name(?:\|(.)(.))?\}/g, (m, a, b) => a ? playerName + (hasBatchim(playerName) ? a : b) : playerName);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');
}

/* ---------- 등장인물 ---------- */
const CAST = {
  jian:     { name: '지안', skin: '#F6D9C6', hair: '#3A2824', hairStyle: 'bob', shirt: '#F2C14E', outfit: 'hoodie', hatColor: '#6C7BD9' },
  senior:   { name: '민재 선배', skin: '#EFC8AC', hair: '#1E1A1A', hairStyle: 'short', shirt: '#2F3E6B', outfit: 'jacket', glasses: true },
  prof:     { name: '강 교수님', skin: '#F0CDB5', hair: '#BDB8B1', brow: '#8A847C', hairStyle: 'gray', shirt: '#4A4A55', outfit: 'suit', glasses: true },
  stranger: { name: '낯선 학생', skin: '#F3D3C0', hair: '#5A3A2E', hairStyle: 'long', shirt: '#A9C6E8', outfit: 'cardigan' },
  ta:       { name: '열람실 조교', skin: '#F1CDB6', hair: '#2E2626', hairStyle: 'bob', shirt: '#DCD6CB', outfit: 'lanyard' },
  freshman: { name: '신입생', skin: '#EAC2A6', hair: '#262222', hairStyle: 'buzz', shirt: '#8DB57C', outfit: 'tee' }
};

function outfitSVG(c) {

    case 'jacket':
      return `<path d="M124 286L150 322L176 286Z" fill="#EDEDED"/><path d="M118 284L150 330L182 284" fill="none" stroke="#F4F4F4" stroke-width="8" stroke-linejoin="round"/><path d="M58 366L84 342M242 366L216 342" stroke="#F4F4F4" stroke-width="6"/><circle cx="212" cy="360" r="12" fill="#F4F4F4"/><circle cx="212" cy="360" r="6" fill="${c.shirt}"/>`;

}

function hairSVG(style, H) {
  switch (style) {

      return {

      }

    case 'short':
      return {
        back: `<ellipse cx="150" cy="140" rx="74" ry="68" fill="${H}"/>`,
        front: `<path d="M82 160C84 104 120 82 160 84C198 88 222 112 218 160C204 136 182 122 160 122C136 124 106 138 82 160Z" fill="${H}"/>`

    case 'buzz':
    default:
      return {
        back: `<ellipse cx="150" cy="136" rx="70" ry="60" fill="${H}"/>`,
        front: `<path d="M86 148C90 100 122 86 150 86C178 86 210 100 214 148C192 130 170 126 150 126C130 126 108 130 86 148Z" fill="${H}"/>`
      };
  }
}

function charSVG(sp) {
  const c = CAST[sp.id], S = c.skin, K = '#2A2430';
  const e = sp.expr || 'neutral';
  const hair = hairSVG(sp.perm ? 'perm' : c.hairStyle, c.hair);
  const brow = c.brow || c.hair;
  const EY = 184, LX = 122, RX = 178;

  let hat = '';

    let ribs = '';

    hat = `<path d="M78 148C74 80 118 56 150 56C182 56 226 80 222 148Z" fill="${hc}"/><rect x="74" y="124" width="152" height="28" rx="13" fill="${band}"/>${ribs}<circle cx="150" cy="52" r="15" fill="${shade(hc, 0.3)}"/>`;
  }

  let brows;
  if (e === 'sad' || e === 'teary' || e === 'tired') brows = `M110 159Q122 155 134 151M166 151Q178 155 190 159`;
  else if (e === 'surprised') brows = `M110 151Q122 143 134 148M166 148Q178 143 190 151`;

  const browSVG = `<path d="${brows}" stroke="${brow}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;

  const big = x => `<ellipse cx="${x}" cy="${EY}" rx="8.5" ry="10.5" fill="#FFFFFF" stroke="${K}" stroke-width="3"/><circle cx="${x}" cy="${EY + 1}" r="4.5" fill="${K}"/>`;
  const tired = x => `<path d="M${x - 9} ${EY}L${x + 9} ${EY}" stroke="${K}" stroke-width="3.5" stroke-linecap="round"/><path d="M${x - 7} ${EY + 1}Q${x} ${EY + 9} ${x + 7} ${EY + 1}Z" fill="${K}"/><path d="M${x - 8} ${EY + 13}Q${x} ${EY + 17} ${x + 8} ${EY + 13}" stroke="rgba(90,60,90,.35)" stroke-width="2" fill="none"/>`;
  let eyes;

  else eyes = dot(LX) + dot(RX);

  const line = d => `<path d="${d}" stroke="${K}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  const mouths = {
    smile: line('M138 212Q150 223 162 212'),

    neutral: line('M142 216L158 216'),
    sad: line('M139 221Q150 211 161 221'),
    teary: line('M139 221Q150 211 161 221'),
    surprised: `<ellipse cx="150" cy="218" rx="7" ry="9" fill="#8E3B46"/>`,
    awkward: line('M136 216q5 -4 10 0t10 0t10 0'),
    tired: line('M142 217Q150 214 158 217')
  };
  const mouth = mouths[e] || mouths.neutral;
  const blush = (e === 'smile' || e === 'happy' || e === 'awkward')
    ? `<ellipse cx="106" cy="206" rx="12" ry="6" fill="#F2A0A6" opacity=".5"/><ellipse cx="194" cy="206" rx="12" ry="6" fill="#F2A0A6" opacity=".5"/>` : '';
  let extra = '';
  if (e === 'awkward') extra += `<path d="M216 132Q207 150 216 155Q225 150 216 132Z" fill="#A9DBF4" stroke="#5FA9D6" stroke-width="1.5"/>`;
  if (e === 'teary') extra += [LX, RX].map(x => `<path d="M${x + 4} ${EY + 10}Q${x - 1} ${EY + 22} ${x + 4} ${EY + 26}Q${x + 9} ${EY + 22} ${x + 4} ${EY + 10}Z" fill="#A9DBF4"/>`).join('');
  const glasses = c.glasses
    ? `<g fill="rgba(255,255,255,.15)" stroke="#2B2B2B" stroke-width="3"><circle cx="${LX}" cy="${EY}" r="18"/><circle cx="${RX}" cy="${EY}" r="18"/></g><path d="M140 182Q150 176 160 182M104 180L88 176M196 180L212 176" stroke="#2B2B2B" stroke-width="3" fill="none"/>` : '';

  return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
${hair.back}
<path d="M128 220L172 220L174 292Q150 304 126 292Z" fill="${S}"/>
<path d="M128 236Q150 254 172 236L172 248Q150 266 128 248Z" fill="rgba(0,0,0,.08)"/>
<path d="M28 400C34 322 78 292 122 284L178 284C222 292 266 322 272 400Z" fill="${c.shirt}"/>
${outfitSVG(c)}
<ellipse cx="85" cy="186" rx="10" ry="14" fill="${S}"/><ellipse cx="215" cy="186" rx="10" ry="14" fill="${S}"/>
<ellipse cx="150" cy="172" rx="66" ry="76" fill="${S}"/>
${sp.hat ? hat : hair.front}
${browSVG}${eyes}
<path d="M150 193Q147 201 152 203" stroke="rgba(0,0,0,.2)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
${mouth}${blush}${extra}${glasses}
</svg>`;
}

/* ---------- 배경 ---------- */

/* ---------- 진행 엔진 ---------- */
const game = $('#game');
const sceneEl = $('.scene', game);
const charsEl = $('.chars', game);
const dialogEl = $('.dialog', game);
const nameEl = $('.nameplate', game);
const lineEl = $('.line', game);
const moreEl = $('.more', game);
const phoneEl = $('.phone', game);
const choiceEl = $('.choice', game);
const promptEl = $('.prompt', choiceEl);
const optsEl = $('.opts', choiceEl);
const liveEl = $('#live');
const progressEl = $('#progress');
const analyzingEl = $('.analyzing', game);

const S = { steps: [], i: -1, answers: {}, scene: null, mode: 'idle', typing: false, timer: null, full: '', currentQ: null };

function showScreen(id) {
  ['title', 'game', 'result'].forEach(s => { $('#' + s).hidden = s !== id; });
}

function buildCells(el, n, filled) {
  el.innerHTML = '';
  for (let k = 0; k < n; k++) {
    const i = document.createElement('i');
    if (k < filled) i.className = 'done';
    el.appendChild(i);
  }
}

function updateProgress() {
  const n = Object.keys(S.answers).length;
  buildCells(progressEl, QIDS.length, n);
  progressEl.setAttribute('aria-label', `진행 ${n}/${QIDS.length}`);
}

/* 화면 비율에 맞춰 배경이 보이는 범위를 정함: 가로 화면은 좌우를 조금만 자르고, 세로 화면은 핵심 장면 폭(560)을 지킨 채 위아래로 넓힘 */
function viewBoxFor(W, H) {
  const a = W / H, R = 800 / 450, MIN = 560;
  let x, y, w, h;
  if (a >= R) { w = 800; h = 800 / a; x = 0; y = (450 - h) / 2; }
  else if (450 * a >= MIN) { h = 450; w = 450 * a; x = 400 - w / 2; y = 0; }
  else { w = MIN; h = MIN / a; x = 400 - w / 2; y = -(h - 450) * 0.3; }
  return [x, y, w, h].map(v => v.toFixed(1)).join(' ');
}
function fitScene(svg) {
  if (!svg) return;
  const r = game.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  svg.setAttribute('viewBox', viewBoxFor(r.width, r.height));
}
function fitScenes() { sceneEl.querySelectorAll('.scene-layer > svg').forEach(fitScene); }

function setScene(name) {
  S.scene = name;
  const layer = document.createElement('div');
  layer.className = 'scene-layer';
  layer.innerHTML = SCENES[name]();
  fitScene(layer.querySelector('svg'));
  if (reduceMotion) {
    sceneEl.innerHTML = '';
    sceneEl.appendChild(layer);
    return;
  }
  layer.style.opacity = '0';
  sceneEl.appendChild(layer);
  const olds = Array.from(sceneEl.children).filter(n => n !== layer);
  requestAnimationFrame(() => requestAnimationFrame(() => { layer.style.opacity = '1'; }));
  setTimeout(() => olds.forEach(n => n.remove()), 650);
}

function setChars(list) {
  const keep = new Set();
  list.forEach(sp => {
    keep.add(sp.id);
    let el = charsEl.querySelector(`[data-id="${sp.id}"]`);
    const sig = JSON.stringify(sp);
    if (!el) {
      el = document.createElement('div');
      el.className = 'char entering';
      el.dataset.id = sp.id;
      charsEl.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('entering')));
    }
    el.classList.remove('leaving', 'pos-left', 'pos-center', 'pos-right');
    el.classList.add('pos-' + sp.pos);
    if (el.dataset.sig !== sig) { el.innerHTML = charSVG(sp); el.dataset.sig = sig; }
  });
  charsEl.querySelectorAll('.char').forEach(el => {
    if (!keep.has(el.dataset.id)) {
      el.classList.add('leaving');
      setTimeout(() => { if (el.classList.contains('leaving')) el.remove(); }, reduceMotion ? 0 : 380);
    }
  });
}

function setFx(fx) {
  game.classList.toggle('imagine', fx === 'imagine');
}

function shake() {
  if (reduceMotion) return;
  game.classList.remove('shake');
  void game.offsetWidth;
  game.classList.add('shake');
}

function renderPhone(ph) {
  if (!ph) { phoneEl.hidden = true; phoneEl.innerHTML = ''; return; }
  const head = ph.kind === 'news' ? '오늘의 뉴스' : fill(ph.with);
  let body = '';
  if (ph.kind === 'news') {
    body = ph.items.map(n => `<article class="news"><span class="tag">${esc(n.tag)}</span><h4>${esc(fill(n.title))}</h4><p>${esc(fill(n.body))}</p></article>`).join('');
  } else {
    body = ph.items.map(m => `<div class="bub ${m.from}">${m.name ? `<span class="from">${esc(m.name)}</span>` : ''}${esc(fill(m.text))}</div>`).join('');
  }
  phoneEl.innerHTML = `<div class="ph-screen"><div class="ph-head">${esc(head)}</div><div class="ph-body ${ph.kind}">${body}</div></div>`;
  phoneEl.hidden = false;
}

function updateHud(st) {
  if (st.day !== undefined) $('.day', game).textContent = st.day;
  if (st.time !== undefined) $('.hm', game).textContent = st.time;
  if (st.place !== undefined) $('.where', game).textContent = st.place;
}

function speak(who, text) {
  const speaker = who ? fill(who) : '';
  const t = fill(text);
  if (speaker) {
    nameEl.textContent = speaker;
    nameEl.hidden = false;
    nameEl.classList.toggle('me', who === '{name}');
    dialogEl.classList.remove('narr');
  } else {
    nameEl.hidden = true;
    dialogEl.classList.add('narr');
  }
  const shown = charsEl.querySelectorAll('.char:not(.leaving)');
  shown.forEach(el => {
    const isSpeaker = CAST[el.dataset.id] && CAST[el.dataset.id].name === speaker;
    const anyCastSpeaking = Object.values(CAST).some(c => c.name === speaker);
    el.classList.toggle('dim', shown.length > 1 && anyCastSpeaking && !isSpeaker);
  });
  liveEl.textContent = (speaker ? speaker + ': ' : '') + t;
  S.full = t;
  moreEl.hidden = true;
  clearInterval(S.timer);
  if (reduceMotion) { lineEl.textContent = t; S.typing = false; moreEl.hidden = false; return; }
  S.typing = true;
  let k = 0;
  lineEl.textContent = '';
  S.timer = setInterval(() => {
    k += 1;
    lineEl.textContent = t.slice(0, k);
    if (k >= t.length) finishTyping();
  }, 28);
}

function finishTyping() {
  clearInterval(S.timer);
  lineEl.textContent = S.full;
  S.typing = false;
  moreEl.hidden = false;
}

function render(st) {
  if (st.scene && st.scene !== S.scene) setScene(st.scene);
  updateHud(st);
  if (st.fx !== undefined) setFx(st.fx);
  if (st.chars !== undefined) setChars(st.chars);
  renderPhone(st.phone || null);
  if (st.shake) shake();
  if (st.choice) { showChoice(st.choice); return; }
  if (st.end) { finish(); return; }
  speak(st.who, st.text);
}

function advance() {
  if (S.mode !== 'play') return;
  if (S.typing) { finishTyping(); return; }
  S.i += 1;
  while (S.i < S.steps.length) {
    const st = S.steps[S.i];
    if (st.when) {
      const a = S.answers[st.when[0]];
      if (!a || a.type !== st.when[1]) { S.i += 1; continue; }
    }
    break;
  }
  const st = S.steps[S.i];
  if (st) render(st);
}

function showChoice(qid) {
  const q = Q[qid];
  S.mode = 'choice';
  S.currentQ = qid;
  promptEl.textContent = fill(q.prompt);
  optsEl.innerHTML = '';
  q.options.forEach((o, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = `<span class="key" aria-hidden="true">${idx + 1}</span><span class="txt"></span>`;
    $('.txt', b).textContent = fill(o.text);
    b.addEventListener('click', e => { e.stopPropagation(); choose(qid, idx); });
    optsEl.appendChild(b);
  });
  liveEl.textContent = fill(q.prompt);
  choiceEl.hidden = false;
  requestAnimationFrame(() => { const f = optsEl.querySelector('.opt'); if (f) f.focus({ preventScroll: true }); });
}

function choose(qid, idx) {
  if (S.mode !== 'choice' || S.currentQ !== qid) return;
  const o = Q[qid].options[idx];
  S.answers[qid] = { idx, type: o.type };
  choiceEl.hidden = true;
  S.mode = 'play';
  S.currentQ = null;
  updateProgress();
  if (o.after) S.steps.splice(S.i + 1, 0, ...o.after);
  game.focus({ preventScroll: true });
  advance();
}

function finish() {
  S.mode = 'end';
  buildCells($('.cells', analyzingEl), QIDS.length, 0);
  $('.cells', analyzingEl).querySelectorAll('i').forEach((i, k) => { i.style.animationDelay = (0.15 + k * 0.13) + 's'; });
  analyzingEl.hidden = false;
  setTimeout(() => {
    buildResult();
    showScreen('result');
    analyzingEl.hidden = true;
    const r = $('#result');
    r.scrollTop = 0;
    r.focus({ preventScroll: true });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const pin = $('.pin', r);
      if (pin) pin.style.left = pin.dataset.to + '%';
    }));
  }, reduceMotion ? 200 : 1900);
}

/* ---------- 결과 ---------- */
function buildResult() {
  const d = QIDS.filter(id => S.answers[id] && S.answers[id].type === 'D').length;
  const c = QIDS.length - d;
  const tier = TIERS.find(t => d >= t.min);
  const to = (4 + 92 * (c / QIDS.length)).toFixed(1);

  const review = QIDS.map(id => {
    const q = Q[id], a = S.answers[id];
    const o = q.options[a.idx];
    const other = q.options.find(x => x.type !== a.type);
    const label = t => t === 'D' ? '의무론적 선택' : '결과론적 선택';
    const time = q.time.startsWith('다음 날') ? `<small>다음 날</small>${q.time.replace('다음 날 ', '')}` : q.time;
    return `<li>
      <div class="r-time">${time}</div>
      <div>
        <div class="r-head"><span class="r-theme">${esc(q.theme)}</span><span class="chip ${a.type}">${label(a.type)}</span></div>
        <p class="r-choice">${esc(fill(o.text))}</p>
        <p class="r-why">${esc(q.why[a.type])}</p>
        <details><summary>다른 선택을 했다면</summary>
          <p class="r-choice">${esc(fill(other.text))}</p>
          <p class="r-why"><span class="chip ${other.type}">${label(other.type)}</span> ${esc(q.why[other.type])}</p>
        </details>
      </div>
    </li>`;
  }).join('');

  $('#result').innerHTML = `<article class="report" tabindex="-1">
    <p class="who">${esc(playerName)}의 하루를 돌아보면</p>
    <h1 class="type-title">${tier.title}</h1>
    <p class="type-tag">${tier.tag}</p>
    <div class="ruler" role="img" aria-label="의무론적 선택 ${d}번, 결과론적 선택 ${c}번">
      <div class="ends"><b>의무론</b><b>결과론</b></div>
      <div class="bar"><div class="pin" data-to="${to}" style="left:${reduceMotion ? to : 50}%">나</div></div>
    </div>
    <p class="score">열 번의 선택 중 의무론적 선택 ${d}번, 결과론적 선택 ${c}번</p>
    <p class="desc">${tier.desc}</p>
    <div class="aside"><h3>가장 닮은 사상가</h3><p class="big">${tier.thinker}</p><p>${tier.idea}</p></div>
    <div class="aside"><h3>생각해 볼 질문</h3><p>${tier.ask}</p></div>

    <h2>두 입장, 한눈에 보기</h2>
    <div class="tchart">
      <div><h3>의무론</h3>
        <p>행위의 옳고 그름은 결과가 아니라, 그 행위가 마땅히 따라야 할 도덕 법칙, 곧 의무에 맞는지에 달려 있다고 봐요.</p>
        <p class="k">핵심 생각: 선의지, 의무, 정언 명령, 보편화 가능성, 인격을 목적으로 대우하기<br>대표 사상가: 칸트</p></div>
      <div><h3>결과론</h3>
        <p>행위의 옳고 그름은 그 행위가 가져오는 결과에 달려 있다고 봐요. 대표적인 결과론인 공리주의는 더 많은 사람에게 더 큰 행복을 가져오는 행위를 옳다고 봐요.</p>
        <p class="k">핵심 생각: 유용성의 원리, 최대 다수의 최대 행복, 쾌락의 계산<br>대표 사상가: 벤담, 밀</p></div>
    </div>

    <h2>내 선택 돌아보기</h2>
    <ol class="review">${review}</ol>

    <p class="note">이 결과는 수업을 위한 사고 실험이에요. 실제 의무론과 결과론은 훨씬 정교해서, 규칙 공리주의처럼 결과론이면서도 규칙을 중시하는 입장도 있답니다. 결과를 정답으로 받아들이기보다, 친구들과 생각을 나누는 출발점으로 삼아 보세요.</p>
    <div class="again"><button class="btn" id="againBtn" type="button">처음부터 다시 하기</button></div>
  </article>`;
  $('#againBtn').addEventListener('click', () => {
    showScreen('title');
    $('#nm').focus({ preventScroll: true });
  });
}

/* ---------- 시작 ---------- */
function start() {
  const v = $('#nm').value.trim();
  playerName = v || '새내기';
  S.steps = SCRIPT.slice();
  S.i = -1;
  S.answers = {};
  S.scene = null;
  S.typing = false;
  clearInterval(S.timer);
  sceneEl.innerHTML = '';
  charsEl.innerHTML = '';
  setFx('');
  renderPhone(null);
  choiceEl.hidden = true;
  analyzingEl.hidden = true;
  updateProgress();
  showScreen('game');
  game.focus({ preventScroll: true });
  S.mode = 'play';
  advance();
}

$('#startBtn').addEventListener('click', start);
$('#nm').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); start(); }
});
window.addEventListener('resize', fitScenes);
window.addEventListener('orientationchange', () => setTimeout(fitScenes, 200));
if ('ResizeObserver' in window) new ResizeObserver(fitScenes).observe(game);
game.addEventListener('click', () => { if (S.mode === 'play') advance(); });
document.addEventListener('keydown', e => {
  if ($('#game').hidden) return;
  if (S.mode === 'choice') {
    if (e.key === '1' || e.key === '2') { e.preventDefault(); choose(S.currentQ, Number(e.key) - 1); }
    return;
  }
  if (S.mode === 'play' && (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight')) {
    e.preventDefault();
    advance();
  }
});
})();
</script>
</body>
</html>
